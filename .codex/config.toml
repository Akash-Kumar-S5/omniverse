# Project-scoped MCP servers (loads only in trusted projects). Pinned, telemetry off.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.84", "--isolated", "--executable-path", "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome", "--caps=devtools"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.12.0", "--no-usage-statistics", "--isolated", "--executablePath", "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"]
env = { CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS = "1", CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS = "1" }

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.5.1"]

[mcp_servers.blender]
command = "uvx"
args = ["mcp-for-blender==2.2.7"]
env = { DISABLE_TELEMETRY = "true" }
